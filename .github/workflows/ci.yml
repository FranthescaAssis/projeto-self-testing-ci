name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Em pull requests, cancela a execução anterior quando chega um commit novo.
# Na main nenhuma execução é cancelada, para manter o histórico completo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# "shell: bash" ativa o pipefail: se um comando antes do "tee" falhar, o passo falha.
defaults:
  run:
    shell: bash

jobs:
  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Preparar pasta de logs
        run: mkdir -p logs

      - name: Análise estática (ESLint)
        run: npm run lint 2>&1 | tee logs/lint.log

      - name: Testes unitários
        run: npm run test:unit 2>&1 | tee logs/testes-unitarios.log

      - name: Testes de integração
        run: npm run test:integration 2>&1 | tee logs/testes-integracao.log

      - name: Testes de ponta a ponta (E2E)
        run: npm run test:e2e 2>&1 | tee logs/testes-e2e.log

      # Coverage gate: o Jest termina com erro se a cobertura ficar abaixo dos
      # limites definidos em jest.config.js (80% de branches, 85% de linhas e statements).
      - name: Cobertura com limite mínimo (coverage gate)
        run: npm run test:coverage 2>&1 | tee logs/cobertura.log

      - name: Publicar resumo da cobertura
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura como artefato
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-de-cobertura
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar logs do build como artefato
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: logs-do-build
          path: logs/
          if-no-files-found: warn
          retention-days: 14

  carga:
    name: Teste de carga
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: load/requirements.txt

      - name: Instalar dependências
        run: |
          npm ci
          pip install -r load/requirements.txt

      - name: Subir a API
        run: |
          mkdir -p logs
          npm start > logs/api.log 2>&1 &
          for tentativa in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/health > /dev/null; then
              echo "API no ar após ${tentativa}s"
              exit 0
            fi
            sleep 1
          done
          echo "A API não respondeu a tempo"
          cat logs/api.log
          exit 1

      # O script falha se a taxa de erro, a latência média ou a conciliação
      # dos saldos ficarem fora dos limites definidos em load/locustfile.py.
      - name: Executar teste de carga (50 usuários simultâneos)
        run: npm run test:load 2>&1 | tee logs/carga.log

      - name: Publicar resumo do teste de carga
        if: ${{ !cancelled() }}
        run: |
          if [ -f load/results/resumo.md ]; then
            cat load/results/resumo.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar resultado do teste de carga como artefato
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: resultado-teste-de-carga
          path: |
            load/results/
            logs/
          if-no-files-found: warn
          retention-days: 14
